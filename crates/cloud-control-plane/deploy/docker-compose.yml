services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loomgate
      POSTGRES_USER: loomgate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loomgate_dev}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
