name: Release Desktop Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build & Publish (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: swatinem/rust-cache@v2

      - name: Install Linux Tauri v2 system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - name: Install desktop frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build & Upload Tauri v2 Bundles to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.5.0' }}
          releaseName: "LoomGate ${{ github.ref_type == 'tag' && github.ref_name || 'v0.5.0' }}"
          releaseBody: |
            ## LoomGate Desktop Installers

            Zero-config Edge-Cloud Hybrid Microkernel AI Gateway (Anthropic / OpenAI / Gemini lossless IR, Declarative Client Integrations, GUI Channel Pool CRUD, Onion Middleware, Local SQLite Trajectory Fork & Diff, and Cloud Control Plane).

            - **Windows**: `.exe` (NSIS) or `.msi`
            - **macOS**: `.dmg`
            - **Linux**: `.AppImage` or `.deb`

            See `CHANGELOG.md` for full release notes.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
