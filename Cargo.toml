[workspace]
resolver = "2"
members = [
    "crates/gateway-core",
    "crates/gateway-daemon",
    "crates/cloud-control-plane",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
authors = ["LoomGate Contributors"]

[workspace.dependencies]
axum = { version = "0.7", features = ["http1", "http2", "json", "tokio"] }
bytes = "1.7"
dashmap = "6.1"
dirs = "5.0"
futures-core = "0.3"
futures-util = "0.3"
http = "1.1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.10", features = ["v4"] }
